name: "BrowserStack Instrumented Tests"

on:
  workflow_dispatch:
#  push:
#  pull_request_target:
#    types: [ opened, synchronize ]

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browserstack:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Install JDK 21"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: "Create Debug APK and Test APK"
        run: |
          ./gradlew androidDemoApp:assembleDebug
          ./gradlew androidDemoApp:assembleDebugAndroidTest

      - name: "Upload and Run Tests on BrowserStack"
        id: browserstack
        uses: chrisbanes/browserstack-android-action@v0.0.1
        with:
          browserstackUsername: ${{ secrets.BROWSERSTACK_USERNAME }}
          browserstackAccessKey: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project: AlgoKit-WalletSDK-KMP
          buildTag: ${{ github.sha }}
          appFilePath: ${{ github.workspace }}/androidDemoApp/build/outputs/apk/debug/androidDemoApp-debug.apk
          testFilePath: ${{ github.workspace }}/androidDemoApp/build/outputs/apk/androidTest/debug/androidDemoApp-debug-androidTest.apk
          devices: Samsung Galaxy S24-14.0

      - name: "Write to Json file"
        run: |
          mkdir -p ${{ github.workspace }}/androidDemoApp/build/reports/browserstack
          touch ${{ github.workspace }}/androidDemoApp/build/reports/browserstack/test-results.json
          echo '${{ env.test_result }}' > ${{ github.workspace }}/androidDemoApp/build/reports/browserstack/test-results.json

      - name: "Upload Test Results"
        uses: actions/upload-artifact@v7
        with:
          name: browserstack-test-results
          path: ${{ github.workspace }}/androidDemoApp/build/reports/browserstack/test-results.json
